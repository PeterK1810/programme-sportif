<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Programme d'entraînement maison de 4 semaines, menu et liste de courses.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Programme">
<meta name="format-detection" content="telephone=no">
<title>Programme maison</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/archivo.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:"Archivo";src:url("assets/archivo.woff2") format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{
  --bg:#0b0c0e;--s1:#141619;--s2:#1c1f24;--s3:#252930;--line:#2a2e35;
  --ink:#f2f3ef;--mut:#a2a7b0;--dim:#6f747d;
  --lime:#d4ff4a;--lime-ink:#141a00;--ok:#6be39a;--warn:#ffd27a;
  --A:#ff7a59;--B:#38cbb4;--C:#f3b53f;
  --r:18px;--r-s:12px;--tab:64px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-stretch:100%;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:800;line-height:1.05;text-wrap:balance}
p{margin:0;text-wrap:pretty}
.cond{font-stretch:72%;letter-spacing:-.005em}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
#app{max-width:640px;margin:0 auto;padding:calc(var(--safe-t) + 18px) 18px calc(var(--tab) + var(--safe-b) + 28px)}
.view{animation:viewIn .32s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tabs{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabs nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--dim);font-size:11.5px;font-weight:600;letter-spacing:.01em;transition:color .2s}
.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"] svg{stroke:var(--lime);transform:translateY(-1px)}
.tabs a:active svg{transform:scale(.9)}

/* ---------- type ---------- */
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.title{font-size:40px;font-stretch:72%;letter-spacing:-.01em}
.h2{font-size:24px;font-stretch:75%;margin:34px 0 12px}
.lead{color:var(--mut);margin-top:8px}
.muted{color:var(--mut)} .dim{color:var(--dim)}
.small{font-size:14px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;font-weight:700;font-size:16.5px;text-decoration:none;
  transition:transform .15s var(--ease),background .2s,opacity .2s;user-select:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--lime);color:var(--lime-ink)}
.btn-ghost{background:var(--s2);color:var(--ink)}
.btn-block{width:100%}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--s2);transition:transform .15s var(--ease),background .2s}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;color:var(--mut);text-decoration:none;font-weight:600;margin:-6px 0 6px -4px}
.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------- today ---------- */
.today-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.hero{position:relative;border-radius:24px;padding:22px 20px 20px;background:var(--s1);overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(120% 90% at 100% 0%,color-mix(in oklab,var(--c) 28%,transparent),transparent 60%)}
.hero .k{font-size:110px;line-height:.8;font-weight:900;font-stretch:62%;color:var(--c);position:absolute;right:16px;top:14px;opacity:.95}
.hero h2{font-size:34px;font-stretch:72%;max-width:75%;margin:10px 0 6px}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mut);font-size:14.5px;margin-bottom:18px}
.hero .meta b{color:var(--ink);font-weight:700}
.hero .row{display:flex;gap:10px}
.hero .row .btn-primary{flex:1}
.hero.rest{--c:#7a808b}
.done-badge{display:inline-flex;align-items:center;gap:8px;background:color-mix(in oklab,var(--ok) 16%,transparent);color:var(--ok);font-weight:700;border-radius:999px;padding:8px 14px;font-size:15px}
.done-badge svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.6}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:12px 14px;border-radius:var(--r-s);background:var(--s2);font-size:14.5px}

.quick{display:flex;align-items:center;gap:14px;margin-top:12px;padding:14px 16px;border-radius:var(--r);background:var(--s1);text-decoration:none;transition:background .2s}
.quick:active{background:var(--s2)}
.quick .ic{width:44px;height:44px;border-radius:12px;background:var(--s3);display:grid;place-items:center;flex:none}
.quick .ic svg{width:22px;height:22px;stroke:var(--lime);fill:none;stroke-width:2}
.quick b{display:block} .quick small{color:var(--mut)}
.quick .chev{margin-left:auto;color:var(--dim)}

/* progress strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.strip .wk{display:flex;flex-direction:column;gap:6px}
.strip .wk span{font-size:11.5px;color:var(--dim);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.strip .dots{display:flex;gap:5px}
.dot{flex:1;height:30px;border-radius:8px;background:var(--s2);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--dim);font-stretch:75%;text-decoration:none;transition:transform .15s}
.dot:active{transform:scale(.94)}
.dot.past{background:var(--s1);color:#4d525b}
.dot.today{box-shadow:inset 0 0 0 2px var(--c);color:var(--ink)}
.dot.done{background:var(--c);color:#111}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;margin-top:6px}
.stats div{background:var(--s1);padding:12px 14px}
.stats b{display:block;font-size:22px;font-stretch:75%}
.stats small{color:var(--dim);font-size:12.5px}

/* lists */
.list{border-radius:var(--r);background:var(--s1);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 16px;text-decoration:none;position:relative;transition:background .2s;width:100%;text-align:left}
.li+.li::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
a.li:active,button.li:active{background:var(--s2)}
.li .when{width:78px;flex:none;font-size:12.5px;color:var(--dim);font-weight:600;line-height:1.3}
.li .main{flex:1;min-width:0}
.li .main b{display:block;font-weight:600}
.li .main small{color:var(--mut);font-size:13.5px}
.li .chev{color:var(--dim);flex:none}
.chev svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------- sessions ---------- */
.scards{display:grid;gap:12px}
.scard{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:var(--s1);text-decoration:none;transition:background .2s,transform .15s var(--ease)}
.scard:active{transform:scale(.985);background:var(--s2)}
.scard .k{font-size:58px;line-height:.85;font-weight:900;font-stretch:62%;color:var(--c);text-align:center}
.scard h3{font-size:22px;font-stretch:75%}
.scard p{color:var(--mut);font-size:14px;margin-top:2px}
.weeks{display:grid;gap:10px}
.week{padding:14px 16px;border-radius:var(--r);background:var(--s1)}
.week.cur{box-shadow:inset 0 0 0 1px var(--line),0 0 0 1px color-mix(in oklab,var(--lime) 30%,transparent)}
.week header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.week header b{font-size:17px}
.week p{color:var(--mut);font-size:14px;margin:4px 0 10px}
.week .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{display:block;text-decoration:none;padding:9px 10px;border-radius:10px;background:var(--s2);font-size:13.5px;line-height:1.3;transition:transform .15s}
.slot:active{transform:scale(.96)}
.slot b{display:flex;justify-content:space-between;align-items:center;font-size:14.5px}
.slot b i{font-style:normal;color:var(--c);font-weight:900;font-stretch:72%;font-size:17px}
.slot small{color:var(--dim)}
.slot.done{background:color-mix(in oklab,var(--c) 22%,var(--s2))}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--s3);color:var(--mut);white-space:nowrap}
.tag.lime{background:color-mix(in oklab,var(--lime) 18%,transparent);color:var(--lime)}

/* session detail */
.shero{padding:4px 0 6px}
.shero .k{font-size:84px;line-height:.8;font-weight:900;font-stretch:62%;color:var(--c);margin:6px 0 10px}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--s1);border-radius:999px;padding:4px;margin:18px 0 10px;position:relative;width:100%;max-width:340px}
.seg button{position:relative;z-index:1;min-height:42px;border-radius:999px;font-weight:700;font-size:15px;color:var(--mut);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--lime-ink)}
.seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--lime);transition:transform .32s var(--ease)}
.seg[data-v="short"] .pill{transform:translateX(100%)}
.phase{margin-top:26px}
.phase h2{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:10px;display:flex;justify-content:space-between}
.exi{border-radius:var(--r);background:var(--s1);margin-bottom:8px;overflow:hidden;interpolate-size:allow-keywords}
.exi summary{list-style:none;display:flex;align-items:center;gap:14px;padding:10px 14px 10px 10px;cursor:pointer;min-height:68px}
.exi summary::-webkit-details-marker{display:none}
.exi .th{width:84px;height:56px;border-radius:10px;background:var(--s2);flex:none}
.exi .nm{flex:1;min-width:0}
.exi .nm b{display:block;font-weight:600;line-height:1.25}
.exi .dz{font-weight:800;font-stretch:75%;font-size:17px;color:var(--ink);white-space:nowrap}
.exi .chev{transition:transform .3s var(--ease)}
.exi[open] .chev{transform:rotate(90deg)}
.exi::details-content{block-size:0;overflow:hidden;transition:block-size .35s var(--ease),content-visibility .35s allow-discrete}
.exi[open]::details-content{block-size:auto}
.exi .body{padding:2px 14px 16px}
.exi .body p{font-size:15px;margin-top:10px}
.tip{color:var(--warn)}
.cta{position:fixed;z-index:15;left:0;right:0;bottom:calc(var(--tab) + var(--safe-b));padding:12px 18px;background:linear-gradient(transparent,var(--bg) 35%)}
.cta div{max-width:604px;margin:0 auto}

/* video */
.vid{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000 center/cover no-repeat;margin-top:12px}
.vid::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.55))}
.vid .pl{position:absolute;z-index:1;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:rgba(11,12,14,.72);display:grid;place-items:center;transition:transform .2s var(--ease),background .2s}
.vid .pl svg{width:26px;height:26px;fill:var(--lime);margin-left:4px}
.vid:active .pl{transform:scale(.92)}
.vid .lb{position:absolute;z-index:1;left:12px;bottom:10px;font-size:12.5px;font-weight:600;color:#ddd}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt{display:inline-block;margin-top:8px;font-size:13px;color:var(--dim)}

/* ---------- menu ---------- */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:16px 0 14px}
.days::-webkit-scrollbar{display:none}
.days button{min-width:0;min-height:58px;border-radius:14px;background:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;transition:background .2s,color .2s,transform .15s}
.days button small{font-size:10.5px;font-weight:700;color:var(--dim);letter-spacing:.05em}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.days button[aria-pressed="true"] small{color:#555}
.days button.is-today:not([aria-pressed="true"]){box-shadow:inset 0 0 0 1.5px var(--line)}
.days button:active{transform:scale(.94)}
.totals{display:flex;gap:22px;margin:4px 0 14px;align-items:flex-end}
.totals b{font-size:28px;font-stretch:72%;font-weight:800}
.totals span{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.plate{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;margin-top:12px;height:86px}
.plate div{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;font-size:13px;font-weight:600}
.plate div b{font-size:19px;font-stretch:72%}
.rules{display:grid;gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden}
.rules div{background:var(--s1);padding:14px 16px}
.rules b{display:block;margin-bottom:2px}
.rules p{color:var(--mut);font-size:14.5px}
.bul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.bul li{position:relative;padding-left:22px;color:var(--mut);font-size:15px}
.bul li::before{content:"";position:absolute;left:4px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--lime)}
.rgroup h3{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:24px 0 10px}
.mac{font-weight:700;font-stretch:80%;white-space:nowrap;text-align:right;font-size:14px}
.mac small{display:block;color:var(--dim);font-weight:600}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:none}
.sheet.open{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .3s}
.sheet.show .bd{opacity:1}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--s1);border-radius:24px 24px 0 0;
  padding:10px 20px calc(24px + var(--safe-b));transform:translateY(100%);transition:transform .38s var(--ease)}
.sheet.show .pn{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--s3);margin:0 auto 14px}
.sheet .x{position:sticky;top:0;float:right;margin:-2px -6px 0 0;z-index:2}
.rhead h2{font-size:30px;font-stretch:72%;margin:6px 50px 10px 0}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:14px;overflow:hidden;margin:14px 0 20px}
.facts div{background:var(--s2);padding:10px;text-align:center}
.facts b{display:block;font-size:19px;font-stretch:75%}
.facts small{font-size:11.5px;color:var(--dim)}
.ing{margin:0;padding:0;list-style:none}
.ing li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:10px 0;font-size:15.5px}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:800;font-size:14px}
.sec-t{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:22px 0 6px}

/* ---------- checklist ---------- */
.ck{display:flex;align-items:center;gap:14px;min-height:54px;padding:8px 16px;position:relative;cursor:pointer;user-select:none}
.ck+.ck::before{content:"";position:absolute;left:52px;right:0;top:0;height:1px;background:var(--line)}
.ck input{position:absolute;opacity:0;pointer-events:none}
.ck .bx{width:24px;height:24px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--s3);flex:none;display:grid;place-items:center;transition:background .2s,box-shadow .2s}
.ck .bx svg{width:16px;height:16px;stroke:var(--lime-ink);fill:none;stroke-width:3;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s var(--ease) .05s}
.ck input:checked+.bx{background:var(--lime);box-shadow:none}
.ck input:checked+.bx svg{stroke-dashoffset:0}
.ck span{transition:color .2s}
.ck input:checked~span{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--dim)}
.ck input:focus-visible+.bx{outline:2px solid var(--lime);outline-offset:2px}
.progress{height:6px;border-radius:9px;background:var(--s2);overflow:hidden;margin:12px 0 4px}
.progress i{display:block;height:100%;background:var(--lime);border-radius:9px;transition:width .4s var(--ease)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.linkbtn{color:var(--mut);font-weight:600;font-size:14px;min-height:44px;padding:0 4px}

/* banner */
.banner{display:flex;gap:12px;align-items:center;padding:12px 12px 12px 16px;border-radius:var(--r);background:var(--s1);margin-top:12px;animation:viewIn .4s var(--ease) both}
.banner p{font-size:14px;color:var(--mut);flex:1}
.banner b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--safe-b) + 18px);z-index:60;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:14.5px;padding:12px 18px;border-radius:999px;transition:transform .3s var(--ease),opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{transform:translate(-50%,0);opacity:1}

/* ---------- player ---------- */
.player{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;animation:playerIn .35s var(--ease) both}
@keyframes playerIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.p-top{display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 10px) 16px 10px;max-width:640px;width:100%;margin:0 auto}
.p-bar{flex:1;height:6px;border-radius:9px;background:var(--s2);overflow:hidden}
.p-bar i{display:block;height:100%;background:var(--c,var(--lime));transition:width .4s var(--ease)}
.p-count{font-size:13px;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.p-body{overflow:auto;padding:6px 20px 16px;max-width:640px;width:100%;margin:0 auto}
.p-step{animation:stepIn .34s var(--ease) both}
.p-step.back-anim{animation-name:stepBack}
@keyframes stepIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes stepBack{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.p-phase{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.p-name{font-size:38px;font-stretch:70%;margin:10px 0 4px}
.p-dose{font-size:64px;font-weight:900;font-stretch:65%;line-height:1;margin:6px 0 4px;color:var(--c,var(--lime))}
.p-dose small{font-size:18px;font-weight:700;color:var(--mut);font-stretch:90%;margin-left:6px}
.p-note{color:var(--mut);font-size:15px}
.ring{position:relative;width:min(62vw,250px);aspect-ratio:1;margin:16px auto 6px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .tr{stroke:var(--s2)}
.ring .fg{stroke:var(--c,var(--lime));stroke-linecap:round;transition:stroke .3s}
.ring.prep .fg{stroke:var(--ink)}
.ring.refill .fg{transition:stroke-dashoffset .35s cubic-bezier(.2,.8,.2,1),stroke .3s}
.ring.prep .num>div>span{animation:tickIn .9s var(--ease) infinite}
@keyframes tickIn{0%{transform:scale(1.25);opacity:.4}25%{transform:none;opacity:1}}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:84px;font-weight:900;font-stretch:62%;font-variant-numeric:tabular-nums}
.ring .num small{display:block;font-size:14px;font-weight:700;color:var(--mut);font-stretch:100%;text-align:center;margin-top:-6px}
.ring.paused .num{opacity:.45}
.ring.go .fg{animation:pulse 1s var(--ease) infinite}
@keyframes pulse{50%{stroke-width:12}}
.rest-k{text-align:center}
.rest-k .p-name{font-size:52px}
.nextup{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r);background:var(--s1);margin-top:14px;text-align:left}
.nextup .th{width:96px;height:64px;border-radius:10px;background:var(--s2);flex:none}
.p-how{margin-top:12px;border-radius:var(--r);background:var(--s1);padding:2px 16px;interpolate-size:allow-keywords}
.p-how summary{list-style:none;min-height:48px;display:flex;align-items:center;justify-content:space-between;font-weight:600;cursor:pointer}
.p-how summary::-webkit-details-marker{display:none}
.p-how p{font-size:15px;padding-bottom:12px}
.p-how::details-content{block-size:0;overflow:hidden;transition:block-size .3s var(--ease),content-visibility .3s allow-discrete}
.p-how[open]::details-content{block-size:auto}
.p-ctrl{display:grid;grid-template-columns:56px 1fr 56px;gap:12px;align-items:center;padding:12px 16px calc(14px + var(--safe-b));max-width:640px;width:100%;margin:0 auto;border-top:1px solid var(--line)}
.p-ctrl .btn{min-height:60px;font-size:18px}
.p-ctrl .icon-btn{width:56px;height:56px}
.p-ctrl .icon-btn:disabled{opacity:.3}
.p-sub{display:flex;justify-content:center;gap:10px;margin-top:4px}
.end{min-height:100%;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:20px 4px}
.end .chk{width:96px;height:96px;margin:0 auto 22px;border-radius:50%;background:var(--lime);display:grid;place-items:center;animation:pop .5s var(--ease) both}
.end .chk svg{width:48px;height:48px;stroke:var(--lime-ink);fill:none;stroke-width:3.2;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s var(--ease) .25s forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.end h1{font-size:46px;font-stretch:70%}
.end .row{display:grid;gap:10px;margin-top:28px}

@media (min-width:700px){
  .title{font-size:48px}
  .p-name{font-size:46px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- animations d'exercice ---------- */
.anim{margin-top:12px}
.an-stage{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(120% 100% at 50% 0%,#1d2127,#121418 70%);cursor:pointer;touch-action:pan-y}
.an-stage canvas{display:block;width:100%;aspect-ratio:4/3}
.p-body .an-stage canvas{aspect-ratio:4/3;max-height:42dvh}
.an-paused{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:rgba(11,12,14,.75);display:grid;place-items:center;opacity:0;transform:scale(.8);transition:opacity .2s,transform .2s var(--ease);pointer-events:none}
.an-paused svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round}
.anim.paused .an-paused{opacity:1;transform:none}
.an-bar{height:3px;background:var(--s2);border-radius:3px;margin:8px 2px 0;overflow:hidden}
.an-bar i{display:block;height:100%;background:var(--lime);transform-origin:left;transform:scaleX(0)}
.an-bar.hold i{background:var(--ink)}
.an-row{display:flex;gap:8px;align-items:center;margin-top:10px}
.an-views{display:flex;gap:4px;background:var(--s2);border-radius:999px;padding:3px;flex:1;min-width:0}
.an-views button{flex:1;min-height:40px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--mut);transition:background .25s,color .25s;white-space:nowrap}
.an-views button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.an-slow{min-height:46px;padding:0 14px;border-radius:999px;background:var(--s2);font-size:13.5px;font-weight:700;color:var(--mut);transition:background .25s,color .25s}
.an-slow[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink)}
.an-say{min-height:2.9em;margin-top:10px;font-weight:600;font-size:15.5px;line-height:1.4}
.an-say.in{animation:sayIn .35s var(--ease) both}
@keyframes sayIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

<script>window.D={"ex":{"catcow":{"n":"Chat-vache","v":"y39PrKY_4JM","how":"À quatre pattes : inspire en creusant le dos (regard devant), expire en arrondissant (menton vers la poitrine). Lent, au rythme de la respiration.","tip":"Réveille la colonne avant tout le reste."},"knee":{"n":"Genou au mur (mobilité cheville)","v":"ElrpduJn92Y","how":"Face au mur, un pied à ~10 cm. Avance le genou pour toucher le mur SANS décoller le talon. 2 s en avant, retour. Recule le pied quand c'est facile.","tip":"C'est TON exercice clé : à faire à chaque séance, et même les jours off. Mesure la distance pied-mur chaque semaine pour voir le progrès."},"bridge":{"n":"Pont fessier","v":"OUgsJ8-Vi0E","how":"Sur le dos, pieds à plat, genoux pliés. Pousse dans les talons, serre les fessiers, monte jusqu'à l'alignement épaules-hanches-genoux. 1 s en haut, descente contrôlée.","tip":"Ne cambre pas : c'est le fessier qui monte, pas le bas du dos."},"boxsquat":{"n":"Squat sur chaise","v":"AVOS2JYsgrs","how":"Debout devant une chaise solide, pieds largeur d'épaules, pointes légèrement ouvertes. Hanches en arrière, effleure la chaise (sans s'affaler), remonte en poussant dans le sol.","tip":"Cheville raide : glisse un livre ou le tapis plié sous les TALONS, et écarte un peu plus les pieds. Ça rend le squat beaucoup plus facile et propre."},"incline":{"n":"Pompes inclinées","v":"cfns5VDVVvk","how":"Mains sur un plan de travail / table / rebord de canapé. Corps gainé et droit de la tête aux talons, coudes à ~45° du corps, poitrine vers le support.","tip":"Plus le support est bas, plus c'est dur. Semaine 3-4 : descends d'un cran (chaise, puis sol)."},"pushup":{"n":"Pompes au sol (ou sur genoux)","v":"WDIpL0pjun0","how":"Mains un peu plus larges que les épaules, corps gainé, descente poitrine vers le sol, remontée en poussant le sol.","tip":"Si tu ne fais pas 6 propres : sur les genoux, ou retour aux pompes inclinées."},"splitsquat":{"n":"Fente statique (split squat)","v":"REflwhg0jNs","how":"Un grand pas en avant, pied arrière sur la pointe. Descends verticalement, genou arrière vers le sol, buste droit. Remonte. Toutes les reps d'un côté, puis l'autre.","tip":"Amplitude réduite au début. Tiens-toi à un mur ou une chaise pour l'équilibre si besoin."},"hinge":{"n":"Good morning (charnière de hanche)","v":"61zbhuRiwQg","how":"Debout, mains sur la tête ou croisées sur la poitrine, genoux légèrement fléchis. Pousse les fesses en arrière, buste qui s'incline dos PLAT, jusqu'à étirement des ischios. Remonte en serrant les fessiers.","tip":"Aucune contrainte sur la cheville : parfait pour toi."},"row":{"n":"Rowing inversé sous une table","v":"EIFEKZe4Wm8","how":"Allongé sous une table TRÈS solide, mains sur le bord. Corps gainé, tire la poitrine vers la table, redescends lentement.","tip":"Vérifie que la table ne bascule pas ! Plus facile : genoux pliés. Alternative : serviette dans une porte fermée (côté charnières), en tirant le corps vers la porte."},"rlunge":{"n":"Fente arrière","v":"7pkeQFzJR9g","how":"Debout, recule une jambe, descends genou arrière vers le sol, revient en poussant sur le talon avant. Alterne.","tip":"La fente ARRIÈRE sollicite beaucoup moins la cheville que la fente avant."},"ytw":{"n":"Y-T-W au sol","v":"QdGTI4Lshg4","how":"À plat ventre, front sur le tapis. Lève les bras en Y (pouces vers le ciel), puis en T, puis en W (coudes pliés, omoplates serrées). 2 s par position.","tip":"Excellent pour la posture et les épaules. Petit mouvement, gros effet."},"superman":{"n":"Superman","v":"z6PJMT2y8GQ","how":"À plat ventre, bras tendus devant. Décolle bras, poitrine et jambes ensemble, 2 s en haut, redescends.","tip":"Regard vers le sol pour ne pas casser la nuque."},"deadbug":{"n":"Dead bug","v":"UBa7wBucN-4","how":"Sur le dos, bras vers le plafond, genoux à 90°. Bas du dos COLLÉ au sol, tends un bras et la jambe opposée lentement, reviens, change.","tip":"Si le dos décolle, réduis l'amplitude."},"plank":{"n":"Gainage planche","v":"mwlp75MS6Rg","how":"Sur les avant-bras, coudes sous les épaules, corps droit, fessiers et abdos serrés. Respire normalement.","tip":"Mieux vaut 20 s parfaites que 60 s affaissées."},"sideplank":{"n":"Gainage latéral","v":"N_s9em1xTqU","how":"Sur un avant-bras, pieds empilés (ou genoux au sol pour simplifier), hanches hautes, corps aligné.","tip":"Version genoux au sol en semaine 1-2."},"birddog":{"n":"Bird dog","v":"wiFNA3sqjCA","how":"À quatre pattes, tends bras droit + jambe gauche, dos plat comme une table, 2 s, reviens. Alterne.","tip":"Imagine un verre d'eau posé sur ton dos."},"climber":{"n":"Mountain climbers (lents)","v":"cnyTQDSE884","how":"En position de pompe, ramène un genou vers la poitrine, puis l'autre. Rythme contrôlé, hanches basses.","tip":"Mains sur une chaise / le canapé pour une version plus douce."},"circles":{"n":"Cercles de bras & de hanches","v":"mwDgFY86zck","how":"Debout, grands cercles de bras vers l'avant puis vers l'arrière, puis mains sur les hanches et grands cercles du bassin dans les deux sens.","tip":"Amplitude progressive : petits cercles au début, de plus en plus grands."},"calf":{"n":"Étirement du mollet au mur","v":"f1HzSAuB-Vw","how":"Mains au mur, une jambe tendue derrière, talon au sol. Avance le bassin jusqu'à sentir l'étirement dans le mollet. Respire lentement.","tip":"Complément direct du travail de mobilité de cheville."},"child":{"n":"Posture de l'enfant","v":"kH12QrSGedM","how":"À genoux, fesses vers les talons, bras allongés devant, front sur le tapis. Respire profondément dans le dos.","tip":"Expire plus longtemps que tu n'inspires : le rythme cardiaque redescend plus vite."}},"warmup":[{"ex":"catcow","t":45,"note":"8 respirations lentes"},{"ex":"knee","r":"10 / côté"},{"ex":"bridge","r":"10"},{"ex":"circles","t":30}],"cooldown":[{"ex":"knee","t":30,"side":true,"note":"Tiens en fin d'amplitude"},{"ex":"calf","t":30,"side":true},{"ex":"child","t":60}],"sessions":{"A":{"title":"Jambes & Poussée","day":"Lundi","format":"3 séries par exercice · 60 s de repos","short_format":"2 séries par exercice · 60 s de repos","main":[{"ex":"boxsquat","r":"10–12"},{"ex":"incline","r":"8–12"},{"ex":"splitsquat","r":"8 / jambe"},{"ex":"bridge","r":"15"},{"ex":"deadbug","r":"8 / côté"},{"ex":"plank","t":30}]},"B":{"title":"Dos & Posture","day":"Mercredi","format":"3 séries par exercice · 60 s de repos","short_format":"2 séries par exercice · 60 s de repos","main":[{"ex":"hinge","r":"12"},{"ex":"row","r":"8–10"},{"ex":"rlunge","r":"8 / jambe"},{"ex":"ytw","r":"6 cycles"},{"ex":"superman","r":"10"},{"ex":"sideplank","t":20,"side":true}]},"C":{"title":"Circuit cardio","day":"Vendredi","circuit":true,"format":"4 tours · 40 s d'effort / 20 s de repos","short_format":"2 tours · 40 s d'effort / 20 s de repos","main":[{"ex":"boxsquat"},{"ex":"incline"},{"ex":"climber"},{"ex":"bridge"},{"ex":"rlunge","note":"Alterne les jambes"},{"ex":"birddog","note":"Alterne les côtés"}]}},"weeks":[{"t":"Apprentissage","n":"Vise la technique, garde 3 répétitions en réserve."},{"t":"Installation","n":"Version complète. Vise le haut de la fourchette de répétitions."},{"t":"Intensification","n":"Pompes sur un support plus bas, +5 s sur les gainages."},{"t":"Progression","n":"+2 répétitions partout, circuit en 45 s / 15 s. Repèse-toi en fin de semaine."}],"plan":[{"d":"2026-11-02","k":"A","short":true,"w":0},{"d":"2026-11-04","k":"B","short":true,"w":0},{"d":"2026-11-06","k":"C","short":true,"w":0},{"d":"2026-11-09","k":"A","short":false,"w":1},{"d":"2026-11-11","k":"B","short":false,"w":1},{"d":"2026-11-13","k":"C","short":false,"w":1},{"d":"2026-11-16","k":"A","short":true,"w":2},{"d":"2026-11-18","k":"B","short":true,"w":2},{"d":"2026-11-20","k":"C","short":true,"w":2},{"d":"2026-11-23","k":"A","short":false,"w":3},{"d":"2026-11-25","k":"B","short":false,"w":3},{"d":"2026-11-27","k":"C","short":false,"w":3}],"recipes":{"skyr":{"n":"Bol skyr-avoine-fruits rouges","type":"Petit-déj","kcal":460,"p":33,"time":"2 min","tool":"Aucun","ing":["250 g de skyr ou yaourt grec 0 %","40 g de flocons d'avoine (4 c. à soupe)","100 g de fruits rouges surgelés","15 g d'amandes (une petite poignée)","1 c. à café de miel"],"steps":["Verse le skyr dans un bol.","Ajoute l'avoine, les fruits rouges encore surgelés (ils décongèlent en 5 min) et les amandes.","Un filet de miel, c'est prêt."],"tip":"Fais-le le soir dans un pot fermé : le matin l'avoine est fondante (« overnight oats »)."},"mug":{"n":"Omelette au micro-ondes (en mug)","type":"Petit-déj","kcal":515,"p":39,"time":"4 min","tool":"Micro-ondes","ing":["3 œufs","1 tranche de jambon (ou dinde) coupée","1 poignée d'épinards (frais ou surgelés)","20 g de fromage râpé","2 tranches de pain complet","Sel, poivre"],"steps":["Casse les œufs dans un grand mug ou bol, bats à la fourchette 10 s.","Ajoute jambon, épinards, fromage, sel, poivre.","Micro-ondes 1 min, remue, puis encore 45 s–1 min jusqu'à ce que ce soit pris.","Mange avec le pain (grillé si tu veux)."],"tip":"Utilise un grand mug : ça gonfle ! Graisse-le avec un peu d'huile pour laver facilement."},"smoothie":{"n":"Smoothie protéiné (sans banane)","type":"Petit-déj","kcal":530,"p":34,"time":"3 min","tool":"Blender","ing":["300 ml de lait demi-écrémé","150 g de yaourt grec 0 %","40 g de flocons d'avoine","150 g de fruits rouges ou mangue surgelés","1 c. à soupe de beurre de cacahuète"],"steps":["Tout dans le blender.","Mixe 30–40 s.","Bois. Rince le blender tout de suite (10 s au lieu de 5 min plus tard)."],"tip":"Le fruit surgelé remplace la banane pour l'onctuosité. + 1 dose de whey = +24 g de protéines."},"bowlthon":{"n":"Bowl riz-thon-avocat","type":"Déjeuner","kcal":555,"p":34,"time":"4 min","tool":"Micro-ondes","ing":["200 g de riz basmati précuit (1 sachet micro-ondes)","1 boîte de thon au naturel égoutté","3 c. à soupe de maïs en boîte","Une poignée de tomates cerises","½ avocat","Sauce soja + jus de citron"],"steps":["Riz : 2 min au micro-ondes dans son sachet.","Dans un bol : riz, thon, maïs, tomates coupées en 2, avocat en dés.","Arrose de sauce soja et de citron."],"tip":"Variante : remplace le thon par 2 œufs durs ou du saumon fumé."},"wrap":{"n":"Wraps poulet-houmous","type":"Déjeuner","kcal":560,"p":42,"time":"5 min","tool":"Aucun","ing":["2 tortillas complètes","120 g de poulet déjà cuit (blanc tranché ou poulet rôti)","2 c. à soupe de houmous","Salade, tomate, concombre","Option : sauce piquante"],"steps":["Tartine les tortillas de houmous.","Ajoute poulet, salade, tomate et concombre en tranches.","Roule serré. Fini."],"tip":"Achète un poulet rôti et effiloche-le : 3 repas pour 5 min de travail."},"lentilles":{"n":"Salade lentilles-feta","type":"Déjeuner","kcal":580,"p":31,"time":"5 min","tool":"Aucun","ing":["1 boîte de lentilles égouttées (≈ 250 g)","60 g de feta","Tomates, concombre, ½ oignon rouge","1 c. à soupe d'huile d'olive","Jus de citron, sel, poivre"],"steps":["Rince les lentilles dans une passoire.","Coupe les légumes grossièrement, émiette la feta.","Mélange tout avec huile, citron, sel, poivre."],"tip":"Ça se garde 2 jours au frigo : fais double dose et garde la moitié pour le lendemain."},"pates":{"n":"Pâtes complètes thon-tomate","type":"Déjeuner","kcal":500,"p":42,"time":"10 min","tool":"Plaque","ing":["80 g de pâtes complètes (sèches)","150 g de sauce tomate en pot","1 boîte de thon au naturel","10 g de parmesan","Option : origan, piment"],"steps":["Fais cuire les pâtes (8–10 min).","Pendant ce temps : sauce + thon dans un bol, 1 min au micro-ondes.","Égoutte, mélange, parmesan dessus."],"tip":"Pâtes à cuisson rapide (fusilli 7 min) = encore plus de flemme assumée."},"saumon":{"n":"Saumon & légumes « tout sur la plaque »","type":"Dîner","kcal":605,"p":41,"time":"5 min + 20 min de four (sans rien faire)","tool":"Four","ing":["1 pavé de saumon (≈ 150 g)","200 g de brocoli (frais ou surgelé)","250 g de pommes de terre grenaille coupées en 2","1 c. à café d'huile d'olive","Sel, poivre, citron"],"steps":["Four à 200 °C.","Tout sur une plaque   const [path, q] = (h || "/").split("?"); const qs = new URLSearchParams(q || "");
  const parts = path.split("/").filter(Boolean);
  const tab = { "": "today", seances: "train", seance: "train", menu: "food", courses: "cart", conseils: "tips" }[parts[0] || ""] ?? "today";
  closePlayer(true);

  if (path !== prevPath) {

  if (!sheetEl || !sheetEl.classList.contains("open")) return;

function dragClose(pn) {
  let y0 = null, dy = 0;
  pn.addEventListener("touchstart", e => { if (pn.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; pn.style.transition = "none"; } }, { passive: true });
  pn.addEventListener("touchmove", e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); if (dy > 0) pn.style.transform = `translateY(${dy}px)`; }, { passive: true });
  pn.addEventListener("touchend", () => { if (y0 === null) return; pn.style.transition = ""; if (dy > 110) closeSheetNav(); else pn.style.transform = ""; y0 = null; });
}

/* ---------- player ---------- */
function buildSteps(k, mode) {
  const short = mode === "short", w = (D.plan.find(p => p.d === TODAY && p.k === k) || nextFor(k) || { w: 0 }).w;
  const S = [], ex = (it, phase, extra = {}) => {
    const base = { ex: it.ex, phase, note: it.note, ...extra };
    let t = it.t; if (t && (it.ex === "plank" || it.ex === "sideplank") && w >= 2) t += 5;
    if (t && it.side) { S.push({ ...base, t, side: "Côté 1" }); S.push({ ...base, t, side: "Côté 2", auto: true }); }
    else S.push({ ...base, t, r: it.r });
  };
  const rest = (t, label) => S.push({ rest: true, t, label, auto: true });
  D.warmup.filter(it => !(short && it.ex === "circles")).forEach(it => ex(it, "Échauffement"));
  const s = D.sessions[k];
  if (s.circuit) {
    const R = short ? 2 : 4, work = w >= 3 ? 45 : 40, rs = w >= 3 ? 15 : 20;
    for (let r = 1; r <= R; r++) s.main.forEach((it, i) => {
      ex({ ...it, t: work }, "Circuit", { set: `Tour ${r} / ${R}`, auto: !(r === 1 && i === 0) });
      if (i < s.main.length - 1) rest(rs, "Récupère"); else if (r < R) rest(60, "Pause entre les tours");
    });
  } else {
    const N = short ? 2 : 3;
    s.main.forEach((it, i) => { for (let n = 1; n <= N; n++) {
      ex(it, "Corps de séance", { set: `Série ${n} / ${N}` });
      if (!(i === s.main.length - 1 && n === N)) rest(60, "Repos");
    } });
  }
  D.cooldown.forEach((it, i) => ex(it, "Retour au calme", { auto: i > 0 }));
  return S;
}
function ankleSteps() { return [{ ex: "knee", r: "10 / côté", phase: "Mobilité cheville" }, { ex: "knee", t: 30, side: "Côté 1", phase: "Mobilité cheville", note: "Tiens en fin d'amplitude" }, { ex: "knee", t: 30, side: "Côté 2", phase: "Mobilité cheville", auto: true }, { ex: "calf", t: 30, side: "Côté 1", phase: "Mobilité cheville", auto: true }, { ex: "calf", t: 30, side: "Côté 2", phase: "Mobilité cheville", auto: true }]; }

let PL = null;
function openPlayer(k, mode, ankle) {
  if (!ankle && !D.sessions[k]) return go("#/");
  mode = mode === "short" ? "short" : "full";
  const steps = ankle ? ankleSteps() : buildSteps(k, mode);
  const run = store.get("run", null);
  const idx = !ankle && run && run.k === k && run.mode === mode && run.date === TODAY ? Math.min(run.idx, steps.length - 1) : 0;
  const el = document.createElement("div"); el.className = "player"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Séance guidée");
  el.style.setProperty("--c", ankle ? "var(--lime)" : `var(--${k})`);
  document.body.append(el); document.body.style.overflow = "hidden";
  PL = { k, mode, ankle, steps, idx, el, timer: null, started: (run && idx > 0 && run.started) || Date.now(), dir: 1 };
  wake(true);
  renderStep();
}
function closePlayer(silent) {
  if (!PL) return;
  clearTimer(); unmountAll(); wake(false); PL.el.remove(); PL = null; document.body.style.overflow = "";
  if (!silent) toast("Progression gardée");
}
function save() { if (PL && !PL.ankle) store.set("run", { k: PL.k, mode: PL.mode, idx: PL.idx, date: TODAY, started: PL.started }); }
function nextEx(from) { for (let i = from + 1; i < PL.steps.length; i++) if (!PL.steps[i].rest) return PL.steps[i]; return null; }

function renderStep() {
  const { steps, idx, el } = PL, st = steps[idx];
  clearTimer(); save(); unmountAll();
  const pct = (idx / steps.length) * 100;
  const e = st.rest ? null : D.ex[st.ex];
  let body;
  if (st.rest) {
    const n = nextEx(idx), ne = n && D.ex[n.ex];
    body = `<div class="rest-k"><span class="eyebrow">${esc(st.label)}</span>${ring(st.t)}
      ${ne ? `<div class="nextup">${poster(n.ex)}<div><span class="eyebrow">À suivre${n.set ? " · " + esc(n.set) : ""}</span><b style="display:block;margin-top:2px">${esc(ne.n)}</b><small class="muted">${esc(n.t ? n.t + " s" + (n.side ? " · " + n.side : "") : n.r)}</small></div></div>` : ""}
      <div class="p-sub"><button class="btn btn-ghost" data-p="add" style="min-height:44px">+15 s</button></div></div>`;
  } else {
    body = `<div class="p-phase"><span class="tag">${esc(st.phase)}</span>${st.set ? `<span class="tag lime">${esc(st.set)}</span>` : ""}${st.side ? `<span class="tag">${esc(st.side)}</span>` : ""}</div>
      <h1 class="p-name">${esc(e.n)}</h1>
      ${st.t ? ring(st.t) : `<div class="p-dose">${esc(st.r)}<small>répétitions</small></div>`}
      ${st.note ? `<p class="p-note">${esc(st.note)}</p>` : ""}
      ${anim(st.ex)}
      <details class="p-how"${st.t ? "" : " open"}><summary>Comment faire <span class="chev">${ic("chev")}</span></summary><p>${esc(e.how)}</p><p class="tip">${esc(e.tip)}</p></details>`;
  }
  const label = st.rest ? "Passer" : st.t ? "Démarrer" : (st.set ? "Série terminée" : "Fait");
  el.innerHTML = `<div class="p-top"><button class="icon-btn" data-p="close" aria-label="Quitter la séance">${ic("x")}</button><div class="p-bar"><i style="width:${pct}%"></i></div><span class="p-count">${idx + 1}/${steps.length}</span><button class="icon-btn" data-p="snd" aria-label="Sons">${ic(store.get("sound", true) ? "snd" : "mute")}</button></div>
  <div class="p-body"><div class="p-step ${PL.dir < 0 ? "back-anim" : ""}">${body}</div></div>
  <div class="p-ctrl"><button class="icon-btn" data-p="prev" aria-label="Étape précédente" ${idx === 0 ? "disabled" : ""}>${ic("back")}</button><button class="btn btn-primary" data-p="main">${label}</button><button class="icon-btn" data-p="next" aria-label="Passer l'étape">${ic("chev")}</button></div>`;
  el.onclick = onPlayerClick;
  el.querySelector(".p-body").scrollTop = 0;
  hydrate(el);
  if (st.t && (st.rest || st.auto)) startTimer(st.rest ? 0 : 3);
}
function ring(t) {
  const C = 2 * Math.PI * 54;
  return `<div class="ring paused"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="54"/><circle class="fg" cx="60" cy="60" r="54" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="num"><div><span id="tn">${t}</span><small id="tl">secondes</small></div></div></div>`;
}
function onPlayerClick(e) {
  const b = e.target.closest("[data-p]"); if (!b) return;
  const a = b.dataset.p, st = PL.steps[PL.idx];
  if (a === "close") { const ank = PL.ankle, k = PL.k; closePlayer(ank); goBack(ank ? "#/" : `#/seance/${k}`); return; }
  if (a === "snd") { store.set("sound", !store.get("sound", true)); b.innerHTML = ic(store.get("sound", true) ? "snd" : "mute"); beep(); return; }
  if (a === "prev") return step(-1);
  if (a === "next") return step(1);
  if (a === "add" && PL.timer) { PL.timer.end += 15000; PL.timer.total += 15; return; }
  if (a === "main") {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {}
    if (st.rest) return step(1);
    if (!st.t) { buzz(15); return step(1); }
    if (!PL.timer) return startTimer(3);
    if (PL.timer.paused) resumeTimer(); else pauseTimer();
  }
}
function step(d) {
  const n = PL.idx + d; PL.dir = d;
  if (n < 0) return;
  if (n >= PL.steps.length) return finish();
  PL.idx = n; renderStep();
}
function clearTimer() { if (PL && PL.timer) { cancelAnimationFrame(PL.timer.raf); PL.timer = null; } }
function startTimer(prep) {
  const st = PL.steps[PL.idx];
  PL.timer = { total: st.t, prep, end: Date.now() + (prep + st.t) * 1000, paused: false, last: null, raf: 0, wasPrep: false, refilled: false };
  setMain("Pause"); $(".ring", PL.el)?.classList.remove("paused");
  tick();
}
function pauseTimer() { const t = PL.timer; t.paused = true; t.left = t.end - Date.now(); cancelAnimationFrame(t.raf); setMain("Reprendre"); $(".ring", PL.el)?.classList.add("paused"); }
function resumeTimer() { const t = PL.timer; t.paused = false; t.end = Date.now() + t.left; setMain("Pause"); $(".ring", PL.el)?.classList.remove("paused"); tick(); }
function setMain(txt) { const b = $('[data-p="main"]', PL.el); if (b && !PL.steps[PL.idx].rest) b.textContent = txt; }
function tick() {
  const t = PL.timer; if (!t || t.paused) return;
  const now = Date.now(), left = Math.max(0, t.end - now), work = t.total * 1000;
  const inPrep = left > work;
  const prepLeft = left - work;
  const secs = inPrep ? Math.ceil(prepLeft / 1000) : Math.ceil(left / 1000);
  const fg = $(".ring .fg", PL.el), tn = $("#tn", PL.el), tl = $("#tl", PL.el), rg = $(".ring", PL.el);
  const C = 2 * Math.PI * 54;
  if (rg) rg.classList.toggle("prep", inPrep);
  if (fg) {
    if (inPrep) fg.style.strokeDashoffset = C * (1 - prepLeft / (t.prep * 1000));
    else {
      if (t.wasPrep && !t.refilled) { t.refilled = true; rg.classList.add("refill"); setTimeout(() => rg && rg.classList.remove("refill"), 380); }
      fg.style.strokeDashoffset = C * (1 - left / work);
    }
  }
  if (tn && secs !== t.last) {
    tn.textContent = inPrep ? secs : secs; tl.textContent = inPrep ? "Prêt ?" : "secondes";
    if (inPrep) { beep(660, .1, .2); buzz(15); }
    else if (t.wasPrep) { beep(1175, .25, .3); buzz(60); tn.textContent = secs; tl.textContent = "C'est parti"; setTimeout(() => { const x = $("#tl", PL && PL.el); x && (x.textContent = "secondes"); }, 900); }
    else if (secs <= 3 && secs > 0) beep(880, .1);
  }
  rg && rg.classList.toggle("go", !inPrep && secs <= 3 && secs > 0);
  t.wasPrep = inPrep; t.last = secs;
  if (left <= 0) {
    beep(1320, .35, .3); buzz([80, 60, 80]);
    PL.dir = 1;
    if (PL.idx + 1 >= PL.steps.length) return finish();
    PL.idx++; return renderStep();
  }
  t.raf = requestAnimationFrame(tick);
}
function finish() {
  clearTimer();
  const mins = Math.max(1, Math.round((Date.now() - PL.started) / 60000));
  if (!PL.ankle) {
    const d = done(); const p = D.plan.find(x => x.k === PL.k && x.d === TODAY) || D.plan.find(x => x.k === PL.k && !d[x.d] && x.d <= TODAY);
    d[p ? p.d : TODAY] = true; store.set("done", d); store.del("run");
  }
  buzz([60, 40, 120]); beep(988, .15); setTimeout(() => beep(1319, .3), 160);
  const s = PL.ankle ? null : D.sessions[PL.k];
  PL.el.innerHTML = `<div class="p-body"><div class="end"><div class="chk">${ic("check")}</div>
    <span class="eyebrow">${PL.ankle ? "Mobilité" : "Séance " + PL.k}</span><h1>${PL.ankle ? "Cheville travaillée" : "Séance terminée"}</h1>
    <p class="lead">${PL.ankle ? "Deux minutes par jour suffisent pour progresser." : `${esc(s.title)} · ${mins} min. Pense à un repas riche en protéines dans l'heure.`}</p>
    <div class="row">${PL.ankle ? "" : `<a class="btn btn-primary" href="#/menu" data-p="out">Voir le menu du jour</a>`}<a class="btn btn-ghost" href="#/" data-p="out">Terminer</a></div></div></div>`;
  PL.el.onclick = e => { const a = e.target.closest('[data-p="out"]'); if (a) { e.preventDefault(); const h = a.getAttribute("href"); closePlayer(true); prevPath = null; location.replace(h); } };
  wake(false);
}
let wl = null;
async function wake(on) {
  try {
    if (on && "wakeLock" in navigator) { wl = await navigator.wakeLock.request("screen"); }
    else if (!on && wl) { await wl.release(); wl = null; }
  } catch {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && PL) { wake(true); if (PL.timer && !PL.timer.paused) tick(); }
});
document.addEventListener("keydown", e => {
  if (!PL) return;
  if (e.key === "ArrowRight") step(1); else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === " ") { e.preventDefault(); $('[data-p="main"]', PL.el)?.click(); }
  else if (e.key === "Escape") $('[data-p="close"]', PL.el)?.click();
});

/* ---------- install hint ---------- */
let deferred = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; installBanner(); });
function installBanner() {
  const box = $("#install"); if (!box) return;
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const mobile = /iphone|ipad|android/i.test(navigator.userAgent);
  if (standalone || store.get("noInstall", false) || !(mobile || deferred)) { box.innerHTML = ""; return; }
  const ios = /iphone|ipad/i.test(navigator.userAgent);
  box.innerHTML = `<div class="banner"><p><b>Ajoute l'app à ton écran d'accueil</b><br>${deferred ? "Elle s'ouvrira en plein écran, même hors connexion." : ios ? "Touche Partager, puis « Sur l'écran d'accueil »." : "Menu du navigateur, puis « Ajouter à l'écran d'accueil »."}</p>
  ${deferred ? `<button class="btn btn-primary" style="min-height:40px;padding:0 14px" id="inst">Installer</button>` : ""}<button class="icon-btn" id="noinst" aria-label="Masquer" style="width:36px;height:36px">${ic("x")}</button></div>`;
  $("#noinst").onclick = () => { store.set("noInstall", true); box.innerHTML = ""; };
  $("#inst") && ($("#inst").onclick = async () => { deferred.prompt(); await deferred.userChoice; deferred = null; box.innerHTML = ""; });
}

/* ---------- boot ---------- */
document.querySelector(".tabs").innerHTML = `<nav aria-label="Navigation principale">${[
  ["today", "#/", "Aujourd'hui"], ["train", "#/seances", "Séances"], ["food", "#/menu", "Menu"], ["cart", "#/courses", "Courses"], ["tips", "#/conseils", "Conseils"]
].map(([t, h, l]) => `<a href="${h}" data-tab="${t}">${ic(t)}<span>${l}</span></a>`).join("")}</nav>`;
route();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body></html>
